services:
  sonix-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      PORT: "8080"
      SONIX_WEB_DATABASE: /data/sonix-web.db
    volumes:
      - sonix_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  caddy:
    image: caddy:2-alpine
    environment:
      SONIX_DOMAIN: ${SONIX_DOMAIN:?Set SONIX_DOMAIN to a domain whose DNS points to this server}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      sonix-web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sonix_data:
  caddy_data:
  caddy_config:
