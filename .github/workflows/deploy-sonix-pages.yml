name: Deploy Sonix website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GitHub Pages app
        env:
          SONIX_API_BASE: ${{ vars.SONIX_API_BASE }}
          GITHUB_PAGES_PATH: /sonix-emergent
        run: bash scripts/build-github-pages.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-github-pages
      - uses: actions/deploy-pages@v4
        id: deployment
